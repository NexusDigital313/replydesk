# Netlify deploy config for ReplyDesk (Next.js 15, App Router)
# The Next.js runtime plugin turns the App Router build into Netlify
# Functions/Edge automatically — API routes (/api/draft, /api/google/*)
# run server-side; the rest is served as static + ISR.

[build]
  command = "pnpm build"
  # publish dir is managed by @netlify/plugin-nextjs; do not hardcode .next

[build.environment]
  # pnpm 11.x requires Node >=22.13 (Node 20 crashes: "No such built-in
  # module: node:sqlite"), so the Netlify infra build needs Node 22.
  NODE_VERSION = "22"

  # Paywall + Lemon Squeezy (all NEXT_PUBLIC -> public by design; license
  # validation is browser-side against LS's public API, no secrets here).
  # These MUST be present at build time or the deployed app ships with no
  # paywall / dead upgrade buttons.
  NEXT_PUBLIC_PAYWALL = "1"
  NEXT_PUBLIC_LS_STORE_ID = "413375"
  NEXT_PUBLIC_LS_CHECKOUT_URL_MONTHLY = "https://nexusdigitalsolutions.lemonsqueezy.com/checkout/buy/d162893b-6e52-49f5-be63-8489efd437be"
  NEXT_PUBLIC_LS_PRODUCT_ID_MONTHLY = "1187418"
  NEXT_PUBLIC_LS_CHECKOUT_URL_ANNUAL = "https://nexusdigitalsolutions.lemonsqueezy.com/checkout/buy/1b90c5b9-0131-4927-ac2f-0270f9c50f1a"
  NEXT_PUBLIC_LS_PRODUCT_ID_ANNUAL = "1187413"

[[plugins]]
  package = "@netlify/plugin-nextjs"
